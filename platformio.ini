; PlatformIO Konfiguration für Fan-Coil Raumbedieneinheit
; Hardware: ESP32, Nextion NX8048P070-011C, RS485 Modbus RTU

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; Serieller Monitor
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Build-Flags
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DCONFIG_ARDUINO_LOOP_STACK_SIZE=8192

; Bibliotheken
lib_deps =
    emelianov/modbus-esp8266@^4.1.0
    paulstoffregen/OneWire@^2.3.7
    milesburton/DallasTemperature@^3.11.0

; Upload-Einstellungen
upload_speed = 921600

; Partition-Schema (für NVS-Speicher)
board_build.partitions = default.csv
